[General]
network = v2x.V2XNetwork
sim-time-limit = 60s
seed-set = ${repetition}
# Define the complete journal-pilot seed set. experiment.py can run any prefix
# with --seeds N, where 1 <= N <= 20.
repeat = 20
num-rngs = 2
*.ue[*].app[0].rng-0 = 1
output-scalar-file = results/${configname}-${repetition}.sca
output-vector-file = results/${configname}-${repetition}.vec
**.vector-recording = false
**.routingRecorder.enabled = false

*.configurator.config = xmldoc("demo.xml")
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti
**.downlinkInterference = true
**.uplinkInterference = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 750m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 250m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50
*.gnb[*].cellularNic.numCarriers = 1
*.gnb[*].cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

*.numRsu = 2
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 500m
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 500m
*.gnb[*].numX2Apps = 1
*.gnb[*].x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb[0].x2App[0].client.connectAddress = "gnb[1]%x2ppp0"
*.gnb[1].x2App[0].client.connectAddress = "gnb[0]%x2ppp0"

*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true
*.ue[*].mobility.typename = "BonnMotionMobility"
*.ue[*].mobility.traceFile = "sumo.movements"
*.ue[*].mobility.nodeId = -1

*.ue[*].numApps = 1
*.ue[*].app[0].typename = "TaskClient"
*.ue[*].app[0].localPort = 5000
*.ue[*].app[0].startTime = 3s + ancestorIndex(1) * 2s
*.ue[*].app[0].stopTime = 53s
*.ue[*].app[0].numServers = 2
*.ue[*].app[0].serverAddresses = "edge[0] edge[1]"
*.ue[*].app[0].serverRates = "16 20"
*.ue[*].app[0].serverXs = "250 750"
*.ue[*].app[0].serverYs = "500 500"
*.edge[*].numApps = 1
*.edge[*].app[0].typename = "TaskServer"
*.edge[0].app[0].workRate = 16
*.edge[1].app[0].workRate = 20

[Config Nearest]
*.ue[*].app[0].policy = "nearest"

[Config Earliest]
*.ue[*].app[0].policy = "earliest"

[Config Risk]
*.ue[*].app[0].policy = "risk"

[Config Replicate]
*.ue[*].app[0].policy = "replicate"

[Config Verge]
*.ue[*].app[0].policy = "verge"

[Config RiskBurst]
extends = Risk
*.ue[*].app[0].taskInterval = 0.2s

[Config ReplicateBurst]
extends = Replicate
*.ue[*].app[0].taskInterval = 0.2s

[Config VergeBurst]
extends = Verge
*.ue[*].app[0].taskInterval = 0.2s

[Config NearestBurst]
extends = Nearest
*.ue[*].app[0].taskInterval = 0.2s

[Config EarliestBurst]
extends = Earliest
*.ue[*].app[0].taskInterval = 0.2s

[Config RiskFailure]
extends = Risk
*.edge[1].app[0].failureStart = 25s
*.edge[1].app[0].failureEnd = 37s

[Config ReplicateFailure]
extends = Replicate
*.edge[1].app[0].failureStart = 25s
*.edge[1].app[0].failureEnd = 37s

[Config VergeFailure]
extends = Verge
*.edge[1].app[0].failureStart = 25s
*.edge[1].app[0].failureEnd = 37s

[Config NearestFailure]
extends = Nearest
*.edge[1].app[0].failureStart = 25s
*.edge[1].app[0].failureEnd = 37s

[Config EarliestFailure]
extends = Earliest
*.edge[1].app[0].failureStart = 25s
*.edge[1].app[0].failureEnd = 37s

