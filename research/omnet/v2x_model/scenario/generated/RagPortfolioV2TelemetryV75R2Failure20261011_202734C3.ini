*.numUe = 75
*.numRsu = 2
*.ue[*].mobility.traceFile = "dubai/downtown-v75-s1/sumo.movements"
*.ue[*].app[0].startTime = 3s + ancestorIndex(1) * 0.05s
*.ue[*].app[0].stopTime = 53s
*.ue[*].app[0].numServers = 2
*.ue[*].app[0].serverAddresses = "edge[0] edge[1]"
*.ue[*].app[0].serverRates = "160.0 160.0"
*.ue[*].app[0].serverXs = "621.732 1865.197"
*.ue[*].app[0].serverYs = "1490.370 1490.370"
**.mobility.constraintAreaMinX = 0.000m
**.mobility.constraintAreaMaxX = 2486.930m
**.mobility.constraintAreaMinY = 0.000m
**.mobility.constraintAreaMaxY = 2980.740m
*.gnb[0].mobility.initialX = 621.732m
*.gnb[0].mobility.initialY = 1490.370m
*.edge[0].app[0].workRate = 160.0
*.gnb[1].mobility.initialX = 1865.197m
*.gnb[1].mobility.initialY = 1490.370m
*.edge[1].app[0].workRate = 160.0
*.gnb[0].numX2Apps = 1
*.gnb[0].x2App[0].client.connectAddress = "gnb[1]%x2ppp0"
*.gnb[1].numX2Apps = 1
*.gnb[1].x2App[0].client.connectAddress = "gnb[0]%x2ppp0"

